name: Tier 1 tests

# The YardMasterSuite (UMM) project references Derail Valley + Unity DLLs through a
# local gitignored Directory.Build.targets, so it cannot build on a runner. CI covers
# YardMasterSuite.Core via YardMasterSuite.Tests; the Release/UMM build stays local
# (see .cursor/rules/deploy-before-smoke.mdc).

on:
  push:
  pull_request:

jobs:
  dotnet-test:
    name: dotnet test (Core)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore YardMasterSuite.Tests/YardMasterSuite.Tests.csproj

      - name: Test
        run: >-
          dotnet test YardMasterSuite.Tests/YardMasterSuite.Tests.csproj
          --no-restore
          --verbosity normal
          --logger "trx;LogFileName=tier1.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ${{ github.workspace }}/TestResults

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier1-results
          path: ${{ github.workspace }}/TestResults
          if-no-files-found: ignore
